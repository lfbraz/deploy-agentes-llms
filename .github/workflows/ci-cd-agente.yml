# Esteira de CI/CD do agente de IA (GitHub Actions) — Aula 07.
# ---------------------------------------------------------------------------
# A Aula 07 roda contra o Databricks (sem modo offline). A esteira tem 3 jobs:
#
#   verificacoes  →  gate-aprovacao  →  registrar-deploy (só no main)
#   (código)         (testes do agente)  (registry + alias + Model Serving)
#
# - `verificacoes` compila o pacote e importa a configuração — não precisa de segredos.
# - `gate-aprovacao` roda os TESTES UNITÁRIOS do agente (pytest) como gate: se um teste falhar,
#   o exit code != 0 BLOQUEIA o merge. Precisa dos segredos DATABRICKS_HOST/DATABRICKS_TOKEN
#   (Settings → Secrets and variables → Actions). Sem eles, os testes são PULADOS (skip) e a
#   esteira segue verde até você configurá-los.
# - `registrar-deploy` (só no main) registra a versão, move o alias champion e faz o deploy.

name: CI/CD do Agente (LLMOps)

on:
  pull_request:
    paths:
      - "aula-07/**"
  push:
    branches: [main]
    paths:
      - "aula-07/**"
  workflow_dispatch: {}

jobs:
  # 1) VERIFICAÇÕES — compila o pacote e importa a config (código, sem segredos).
  verificacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências mínimas
        run: pip install mlflow
      - name: Compilar o pacote e importar a configuração
        working-directory: aula-07
        run: |
          python -m py_compile agente/*.py src/*.py
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          from agente.config import MODELO_UC, INDICE_POLITICAS, FUNC_STATUS_PEDIDO
          print("config OK ->", MODELO_UC, INDICE_POLITICAS, FUNC_STATUS_PEDIDO)
          PY

  # 2) GATE DE APROVAÇÃO — testes unitários do agente REAL; barram o merge se falharem.
  gate-aprovacao:
    needs: verificacoes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -U mlflow databricks-langchain databricks-vectorsearch unitycatalog-ai pytest
      - name: Gate de aprovação (pytest — exit != 0 bloqueia o PR)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          # No runner não existe o aula-07/.env — sem isto o config.py cairia no default
          # (databricks-claude-sonnet-4-5), inexistente no Free Edition. Sobrescreva pela
          # variável de repositório ENDPOINT_LLM_AGENTE (Settings → Variables) se preciso.
          ENDPOINT_LLM_AGENTE: ${{ vars.ENDPOINT_LLM_AGENTE || 'databricks-meta-llama-3-3-70b-instruct' }}
        run: |
          if [ -z "${DATABRICKS_HOST}" ]; then
            echo "::warning::Sem segredos do Databricks — os testes do gate serão PULADOS."
          fi
          pytest aula-07/src/04_gate_aprovacao.py -v -ra

  # 3) REGISTRAR + DEPLOY — só no main e só se o gate passou (governança do champion).
  registrar-deploy:
    needs: gate-aprovacao
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências de deploy
        run: pip install -U mlflow databricks-langchain databricks-vectorsearch unitycatalog-ai databricks-agents
      - name: Registrar a nova versão, mover o alias champion e fazer o deploy
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          ENDPOINT_LLM_AGENTE: ${{ vars.ENDPOINT_LLM_AGENTE || 'databricks-meta-llama-3-3-70b-instruct' }}
        run: |
          if [ -z "${DATABRICKS_HOST}" ]; then
            echo "::warning::Sem segredos do Databricks — deploy PULADO."
            echo "Em produção, este passo executaria o registro + agents.deploy (ver aula-07/src/05_serving_deploy.py):"
            echo "  mlflow.pyfunc.log_model(python_model='agente/serving_model.py', resources=[...],"
            echo "      registered_model_name=MODELO_UC)            # Unity Catalog"
            echo "  mlflow.genai.set_prompt_alias(PROMPT_UC, 'champion', nova_versao)"
            echo "  agents.deploy(MODELO_UC, nova_versao)           # Model Serving"
          else
            echo "Gate verde no main -> registrar no Unity Catalog, promover o alias e fazer deploy."
            # python aula-07/src/05_serving_deploy.py   # registro/deploy (ver o script)
          fi
